<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge-Cloud Migration Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .card h2 {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        
        .status-idle { background: #444; color: #aaa; }
        .status-edge { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
        .status-cloud { background: linear-gradient(135deg, #2196f3, #00bcd4); color: #fff; }
        .status-migrating { background: linear-gradient(135deg, #ff9800, #ffb74d); color: #000; animation: pulse 1s infinite; }
        .status-completed { background: linear-gradient(135deg, #9c27b0, #e91e63); color: #fff; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }
        
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .metric {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .metric-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #f44336, #e91e63);
            color: #fff;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        .history {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }
        
        .history-time {
            color: #00d9ff;
            margin-right: 10px;
        }
        
        .diagram {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }
        
        .node {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .node-edge {
            background: rgba(0, 200, 83, 0.2);
            border: 3px solid #00c853;
        }
        
        .node-cloud {
            background: rgba(33, 150, 243, 0.2);
            border: 3px solid #2196f3;
        }
        
        .node.active {
            transform: scale(1.1);
            box-shadow: 0 0 30px currentColor;
        }
        
        .node-edge.active { color: #00c853; }
        .node-cloud.active { color: #2196f3; }
        
        .arrow {
            font-size: 2rem;
            color: #444;
            transition: all 0.3s ease;
        }
        
        .arrow.active {
            color: #ff9800;
            animation: arrowPulse 0.5s infinite;
        }
        
        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Edge-Cloud Migration Dashboard</h1>
        
        <div class="grid">
            <!-- Task Status Card -->
            <div class="card">
                <h2>Task Status</h2>
                <div id="status-badge" class="status-badge status-idle">IDLE</div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar" style="width: 0%">0%</div>
                </div>
                <div id="task-name" style="color: #888;">No task running</div>
            </div>
            
            <!-- Telemetry Card -->
            <div class="card">
                <h2>System Telemetry</h2>
                <div class="telemetry-grid">
                    <div class="metric">
                        <div id="cpu-value" class="metric-value">0%</div>
                        <div class="metric-label">CPU Load</div>
                    </div>
                    <div class="metric">
                        <div id="mem-value" class="metric-value">0%</div>
                        <div class="metric-label">Memory</div>
                    </div>
                    <div class="metric">
                        <div id="temp-value" class="metric-value">0°C</div>
                        <div class="metric-label">Temperature</div>
                    </div>
                    <div class="metric">
                        <div id="battery-value" class="metric-value">100%</div>
                        <div class="metric-label">Battery</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Migration Diagram -->
        <div class="card">
            <h2>Migration Flow</h2>
            <div class="diagram">
                <div id="node-edge" class="node node-edge">
                    <span style="font-size: 2rem;">💻</span>
                    <span>EDGE</span>
                </div>
                <div id="arrow-right" class="arrow">➡️</div>
                <div id="node-cloud" class="node node-cloud">
                    <span style="font-size: 2rem;">☁️</span>
                    <span>CLOUD</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn-start" onclick="startTask()">▶️ Start Task</button>
                <button class="btn-stop" onclick="stopTask()">⏹️ Stop Task</button>
            </div>
        </div>
        
        <!-- History Card -->
        <div class="card">
            <h2>Event History</h2>
            <div id="history" class="history">
                <div class="history-item">
                    <span class="history-time">--:--:--</span>
                    Waiting for events...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function updateDashboard() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    // Update status badge
                    const badge = document.getElementById('status-badge');
                    badge.textContent = data.location.toUpperCase();
                    badge.className = 'status-badge status-' + data.location;
                    
                    // Update progress
                    const progress = data.progress || 0;
                    document.getElementById('progress-bar').style.width = progress + '%';
                    document.getElementById('progress-bar').textContent = progress + '%';
                    
                    // Update task name
                    document.getElementById('task-name').textContent = 
                        data.task_name ? `Task: ${data.task_name}` : 'No task running';
                    
                    // Update telemetry
                    document.getElementById('cpu-value').textContent = 
                        (data.telemetry.cpu || 0).toFixed(1) + '%';
                    document.getElementById('mem-value').textContent = 
                        (data.telemetry.mem || 0).toFixed(1) + '%';
                    document.getElementById('temp-value').textContent = 
                        (data.telemetry.temp || 0).toFixed(1) + '°C';
                    document.getElementById('battery-value').textContent = 
                        (data.telemetry.battery || 100) + '%';
                    
                    // Update diagram
                    const nodeEdge = document.getElementById('node-edge');
                    const nodeCloud = document.getElementById('node-cloud');
                    const arrow = document.getElementById('arrow-right');
                    
                    nodeEdge.classList.remove('active');
                    nodeCloud.classList.remove('active');
                    arrow.classList.remove('active');
                    
                    if (data.location === 'edge') {
                        nodeEdge.classList.add('active');
                    } else if (data.location === 'cloud') {
                        nodeCloud.classList.add('active');
                    } else if (data.location === 'migrating') {
                        arrow.classList.add('active');
                    }
                })
                .catch(err => console.error('Error:', err));
        }
        
        function startTask() {
            fetch('/api/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log('Task started:', data);
                    addHistory('Task started');
                });
        }
        
        function stopTask() {
            fetch('/api/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log('Task stopped:', data);
                    addHistory('Task stopped');
                });
        }
        
        function addHistory(event) {
            const history = document.getElementById('history');
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span class="history-time">${time}</span>${event}`;
            history.insertBefore(item, history.firstChild);
        }
        
        // Update every second
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
